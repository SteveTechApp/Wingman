version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WINGMAN_ENABLE_PROJECT_BACKEND_SYNC: ${VITE_WINGMAN_ENABLE_PROJECT_BACKEND_SYNC:-true}
        VITE_WINGMAN_ENABLE_GURU_EXTERNAL_LOOKUP: ${VITE_WINGMAN_ENABLE_GURU_EXTERNAL_LOOKUP:-false}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-local}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wingman-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8787:8787"
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - NODE_ENV=production
      - WINGMAN_CORS_ALLOW_ORIGIN=${WINGMAN_CORS_ALLOW_ORIGIN:-http://localhost:3000}
      - WINGMAN_MAX_JSON_BODY_BYTES=${WINGMAN_MAX_JSON_BODY_BYTES:-1048576}
      - WINGMAN_SESSION_COOKIE_SECURE=${WINGMAN_SESSION_COOKIE_SECURE:-false}
      - WINGMAN_ENABLE_SECURITY_HEADERS=${WINGMAN_ENABLE_SECURITY_HEADERS:-true}
      - WINGMAN_STORAGE_MODE=${WINGMAN_STORAGE_MODE:-auto}
      - WINGMAN_STORAGE_FAIL_CLOSED=${WINGMAN_STORAGE_FAIL_CLOSED:-false}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_WINGMAN_TABLES_ENABLED=${SUPABASE_WINGMAN_TABLES_ENABLED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOOKUP_ENABLE_LIVE_ENRICHMENT=${LOOKUP_ENABLE_LIVE_ENRICHMENT:-true}
      - LOOKUP_RETRY_ATTEMPTS=${LOOKUP_RETRY_ATTEMPTS:-3}
      - LOOKUP_TIMEOUT_MS=${LOOKUP_TIMEOUT_MS:-4500}
      - LOOKUP_CACHE_TTL_MS=${LOOKUP_CACHE_TTL_MS:-1800000}
    volumes:
      - wingman-runtime:/app/data/runtime
    networks:
      - wingman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8787/api/product-intelligence/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  wingman-network:
    driver: bridge

volumes:
  wingman-runtime:
    driver: local
