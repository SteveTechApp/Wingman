<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    
    
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingman</title>
            <script>
      (function () {
        try {
          var storageKey = "wingman-theme-mode";
          var legacyStorageKey = "wingman-theme";
          var storedMode =
            window.localStorage.getItem(storageKey) ||
            window.localStorage.getItem(legacyStorageKey) ||
            "system";
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolvedTheme =
            storedMode === "dark" || (storedMode !== "light" && prefersDark) ? "dark" : "light";

          document.documentElement.setAttribute("data-theme", resolvedTheme);
          document.documentElement.setAttribute("data-theme-mode", storedMode);
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-theme-mode", "system");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
