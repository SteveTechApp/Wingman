name: Supabase secrets drill (diagnostic)

# On-demand diagnostic for the Supabase secrets configuration. Prints which
# of the four Supabase secrets are available and classifies the setup into
# the same states the live gates (supabase-rls.yml) will hit - so a
# misconfiguration is diagnosable from the Actions tab WITHOUT a failing
# push or a red nightly.
#
# This workflow is NEVER a gate: it always exits 0. A missing secret here is
# a finding to read, not a failure. The secret PRESENCE checks that DO fail
# live in the reusable workflow's gates and in ci.yml's selfcheck job.
#
# Run it from the Actions tab ("Run workflow"), optionally with the summary
# printed straight into the run summary page.

on:
  workflow_dispatch:
    inputs:
      write_summary:
        description: "Also write the report to the run summary page"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  report:
    name: Report Supabase secrets configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Report Supabase secrets configuration (diagnostic, never fails)
        id: report
        # Secrets are passed explicitly so the report reflects exactly what a
        # live run would see; fork contexts simply show every secret ABSENT.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node tools/check-supabase-secret-config.mjs | tee "$RUNNER_TEMP/secret-drill-report.txt"
          echo "report=$RUNNER_TEMP/secret-drill-report.txt" >> "$GITHUB_OUTPUT"

      - name: Append report to the run summary
        if: inputs.write_summary
        run: |
          {
            echo "### Supabase secrets configuration drill"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/secret-drill-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
