name: Governed Data Gate

# The full governed batch gate (`govern:wyrestorm`) rewritten in check-only form
# for CI. PRs touching the governed profiles must pass the strict coverage gate,
# the technical-data baseline check and the badge/copy render gate before they
# can land - with nothing applied or written by CI.
#
# `--apply` and `--update-baseline` are deliberately absent: the batch workflow
# is a local authoring tool that writes promotions and baselines, and CI must
# only ever verify a PR's committed state, never mutate it.

on:
  push:
    branches: [main]
    paths:
      - 'data/governance/**'
      - 'data-sources/wyrestorm/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/governance/**'
      - 'data-sources/wyrestorm/**'

permissions:
  contents: read

jobs:
  governed-data-gate:
    name: Governed Data Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The canonical product store (data/wingman-canonical-product-store.json)
      # is generated, not committed: the current-catalog completeness gate in
      # check:technical-data reads it, so it must be rebuilt here from the
      # committed data-sources before any check runs.
      - name: Generate canonical product data
        run: npm run data:canonical-products

      # Check-only mirror of `govern --apply --strict`. `--strict` without
      # `--apply` runs the strict coverage gate in dry-run: it fails when any
      # active-lead profile still needs human-curated data instead of writing
      # the promotion.
      - name: Run governed profile strict gate
        run: node tools/govern-wyrestorm-profiles.mjs --strict

      # Compares against the committed coverage baseline in
      # tools/wyrestorm-technical-data-coverage-baseline.json.
      # `--update-baseline` is intentionally not passed so CI never rewrites it.
      # Also enforces the current-catalog completeness gate: every product the
      # website currently lists as a specifiable lead (active, or review with a
      # captured official page) must have a governed profile of any status -
      # a lifecycle mislabel can never silently hide a coverage gap.
      - name: Check technical data against baseline
        run: npm run check:technical-data:strict

      - name: Audit technical data
        run: node tools/audit-wyrestorm-technical-data.mjs

      # The PDF spec-sheet ingestion gate: every spec-bearing official PDF in
      # the committed manifest must belong to a current, specifiable product
      # that either already has a governed profile or is drafted by
      # `npm run ingest:wyrestorm-spec-sheets`. A spec sheet for a current
      # product with no profile fails here instead of silently waiting.
      - name: Check spec-sheet ingestion is complete
        run: npm run check:spec-sheet-ingest

      # The governed drift gate: every profile's spec-critical fields
      # (max resolution, routed I/O, power) must agree with the canonical
      # store, and no human-verified profile may carry a max-resolution the
      # review cannot classify. A confirmation batch that introduces field
      # drift fails here.
      - name: Run governed field-drift gate
        run: npm run check:governed-drift

      # The review-pass gate: dry-runs the structured confirmation pass
      # without writing - every CONFIRMATION_BATCH SKU must be present,
      # readable, evidence-backed and already human-verified, with no value
      # fixes pending. A half-applied confirmation batch fails here.
      - name: Verify governed review pass is fully applied
        run: npm run check:governed-review-pass

      - name: Run technical-data engine tests
        run: npm run check:technical-data-tests

      # The badge honesty and copy-consistency render gate: every compare /
      # product pitch / catalog match-card badge must read "Verified governed
      # data", the profile-stripped honesty paths must stay honest, and the
      # legacy "Technical data missing" wording must not reappear anywhere in
      # app code, docs or data sources.
      - name: Run governed badge and copy render gate
        run: npm run check:governed-coverage-render

      # The competitor-decision drift gate: the committed golden baseline in
      # data/governance/competitor-match-decisions.json must match the live
      # engine's outcome for every approved competitor row. An outcome flip
      # (decision type, lead candidate, or option set) fails loudly instead of
      # silently changing what a rep sees.
      - name: Run competitor decision drift gate
        run: npm run check:competitor-decisions

      # The compare trust-layer structural check: ledger populated, no
      # duplicate decisions, and only human decisions carry the approval
      # contract (machine baselines stay pending-review).
      - name: Run compare trust-layer check
        run: npm run check:compare-trust-layer
