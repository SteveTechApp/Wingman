name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical product data
        run: npm run data:canonical-products

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

  # The verify pipeline is split into stages so a failure reports every broken
  # category at once instead of stopping at the first one. Each stage runs as
  # its own job, so wall-clock is the slowest stage rather than the sum.
  verify:
    name: Verify (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [data, contract, visual]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical product data
        run: npm run data:canonical-products

      - name: Build
        run: npm run build

      - name: Run verify stage
        run: npm run verify:${{ matrix.stage }}

  # Live RLS posture check, shared with the nightly schedule via the reusable
  # workflow .github/workflows/supabase-rls.yml (kept identical so CI and the
  # nightly run enforce the exact same gate). Runs on every push to main and
  # every PR; the cron triggers it on main even when nothing is pushed.
  # See supabase-rls.yml for what the sentinel probe verifies and the secret
  # requirements (SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SECRET_KEY).
  supabase-rls:
    name: Supabase RLS (live, sentinel)
    uses: ./.github/workflows/supabase-rls.yml
    secrets: inherit

  # Dry-run self-check of the supabase-rls wiring above - it verifies the gate
  # itself, without touching the live database (verify-supabase-rls.mjs is
  # never run here). Two parts:
  #   1. A static pass (tools/check-supabase-rls-workflow.mjs) proves
  #      supabase-rls.yml still wires all three secrets into the sentinel probe
  #      and that ci.yml + the nightly schedule pass them via `secrets:
  #      inherit`. These regressions are invisible to the live check: drop
  #      SUPABASE_SECRET_KEY from the env mapping and the probe silently falls
  #      back to read-only mode, which cannot prove protection on empty tables.
  #   2. A secret-presence dry run that FAILS with a clear message when
  #      SUPABASE_SECRET_KEY is absent from the repository while SUPABASE_URL
  #      and SUPABASE_ANON_KEY are configured - a partial secret setup must
  #      never quietly run the weaker mode. (On fork PRs all secrets are
  #      unavailable, so the step skips - matching the live job.)
  supabase-rls-selfcheck:
    name: Supabase RLS workflow self-check (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify supabase-rls.yml wires all three secrets (static)
        run: node tools/check-supabase-rls-workflow.mjs

      - name: Verify repository secret presence (dry run, no live probe)
        id: secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Supabase secrets are not available in this context (fork PR or unconfigured repository) - the live RLS job will skip. Workflow wiring was verified statically above."
          elif [ -z "${{ secrets.SUPABASE_SECRET_KEY }}" ]; then
            echo "::error::SUPABASE_SECRET_KEY is absent from the repository secrets (or unavailable in this context). The reusable supabase-rls.yml gate needs it: sentinel mode seeds a marker row per table through the service role, and without it the anon probe cannot prove protection on empty tables - the live check would degrade to inconclusive read-only notes. Add SUPABASE_SECRET_KEY alongside SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "All three Supabase secrets are configured - the live RLS job will run in sentinel mode."
          fi

  # Proves the built app actually boots and renders. Playwright was already a
  # devDependency and check:browser already existed; neither had ever run in CI.
  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate canonical product data
        run: npm run data:canonical-products

      - name: Build
        run: npm run build

      - name: Run browser smoke check
        run: npm run check:browser

      # Boots the real API (throwaway file-mode data dir) and the Vite dev UI,
      # then drives a browser through settings sign-in, discovery project save
      # + HTML brief export, compare history save + CSV export, and the 413
      # oversized-body contract - no manual session needed.
      - name: Run end-to-end smoke check
        run: npm run check:e2e-smoke


  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # Wraps `npm audit` so a single assessed advisory can be excepted with a
      # written justification and an expiry, instead of one finding that does
      # not apply to Wingman blocking every merge. Exceptions live in
      # tools/dependency-audit-exceptions.json and expire.
      - name: Run dependency audit (root and server)
        run: npm run check:dependency-audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Ratchet: fails if a tracked chunk, total JS/CSS or source hotspot grows
      # beyond its recorded budget in tools/wingman-size-budgets.json.
      - name: Check size budgets
        run: npm run check:size-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
