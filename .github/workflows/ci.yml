name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical product data
        run: npm run data:canonical-products

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

  # The verify pipeline is split into stages so a failure reports every broken
  # category at once instead of stopping at the first one. Each stage runs as
  # its own job, so wall-clock is the slowest stage rather than the sum.
  verify:
    name: Verify (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [data, contract, visual]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical product data
        run: npm run data:canonical-products

      - name: Build
        run: npm run build

      - name: Run verify stage
        run: npm run verify:${{ matrix.stage }}

  # Proves the LIVE Supabase project's RLS actually protects the Wingman
  # tables. check:migration-parity (inside verify:data) proves the migration
  # FILES agree; this proves the DATABASE agrees with them. Read-only: the
  # tool issues SELECTs with the public anon key and exits nonzero if any
  # table returns rows to it. Needs the SUPABASE_URL and SUPABASE_ANON_KEY
  # repository secrets; the job is skipped with a clear message when they
  # are not configured (e.g. fork PRs, where GitHub never exposes secrets).
  supabase-rls:
    name: Supabase RLS (live)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify secrets are configured
        id: secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Supabase secrets not configured - skipping live RLS verification."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify live RLS posture with the anon key
        if: steps.secrets.outputs.skipped == 'false'
        run: node tools/verify-supabase-rls.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # Proves the built app actually boots and renders. Playwright was already a
  # devDependency and check:browser already existed; neither had ever run in CI.
  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate canonical product data
        run: npm run data:canonical-products

      - name: Build
        run: npm run build

      - name: Run browser smoke check
        run: npm run check:browser


  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # Wraps `npm audit` so a single assessed advisory can be excepted with a
      # written justification and an expiry, instead of one finding that does
      # not apply to Wingman blocking every merge. Exceptions live in
      # tools/dependency-audit-exceptions.json and expire.
      - name: Run dependency audit (root and server)
        run: npm run check:dependency-audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Ratchet: fails if a tracked chunk, total JS/CSS or source hotspot grows
      # beyond its recorded budget in tools/wingman-size-budgets.json.
      - name: Check size budgets
        run: npm run check:size-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
